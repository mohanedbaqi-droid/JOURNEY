workflows:
  journey-demo-ios:
    name: JOURNEY DEMO 2.4.19 (51)
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events: [push]
      branch_patterns:
        - pattern: ios-demo-car-states
          include: true
          source: true
    environment:
      xcode: 16.0
    scripts:
      - name: Validate and generate demo project
        script: |
          set -e
          swiftc ios/JourneyControl/Models/VehicleState.swift ios/JourneyControl/Models/DemoVehicleSimulation.swift ios/Tests/DemoSimulationTests.swift -o /tmp/journey-demo-tests
          /tmp/journey-demo-tests
          cd ios
          xcodegen generate
      - name: Build demo IPA
        script: |
          set -e
          cd ios
          xcodebuild -resolvePackageDependencies -project JourneyControl.xcodeproj -scheme JourneyControl
          xcodebuild -project JourneyControl.xcodeproj -scheme JourneyControl -configuration Release -sdk iphoneos -derivedDataPath "$CM_BUILD_DIR/DerivedData-demo" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="$CM_BUILD_DIR/DerivedData-demo/Build/Products/Release-iphoneos/JourneyControl.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.abuseif.journey.demo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/JourneyWidget.appex/Info.plist")" = "com.abuseif.journey.demo.widget"
          mkdir -p "$CM_BUILD_DIR/ipa-demo/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa-demo/Payload/"
          cd "$CM_BUILD_DIR/ipa-demo"
          zip -qry "$CM_BUILD_DIR/JOURNEY-DEMO-2.4.19-51-unsigned.ipa" Payload
          unzip -t "$CM_BUILD_DIR/JOURNEY-DEMO-2.4.19-51-unsigned.ipa"
    artifacts:
      - JOURNEY-DEMO-2.4.19-51-unsigned.ipa

name: PunisherDrive
options:
  bundleIdPrefix: com.abuseif
  deploymentTarget:
    iOS: "18.0"
targets:
  PunisherDrive:
    type: application
    platform: iOS
    sources:
      - PunisherDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abuseif.punisherdrive
        INFOPLIST_KEY_CFBundleDisplayName: "Punisher Drive"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Punisher Drive uses the camera to capture vehicle and customer documents."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Punisher Drive lets you choose vehicle and customer document images."
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.8.5
        CURRENT_PROJECT_VERSION: 18

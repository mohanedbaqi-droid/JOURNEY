name: Build Punisher Drive Android APK

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "PunisherAndroid/**"
      - "standalone/v04/**"
      - "standalone/v07/**"
      - "standalone/v09/**"
      - "standalone/v11/**"
      - "standalone/v12/**"
      - "standalone/v13/**"
      - ".github/workflows/build-punisher-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore vehicle catalog
        run: |
          set -euo pipefail
          cat standalone/v04/part00.b64 standalone/v04/part01.b64 standalone/v04/part02.b64 standalone/v04/part03.b64 standalone/v04/part04.b64 > /tmp/pd_v04.b64
          base64 -d /tmp/pd_v04.b64 > /tmp/pd_v04.zip
          rm -rf /tmp/pd_v04
          mkdir -p /tmp/pd_v04
          unzip -oq /tmp/pd_v04.zip -d /tmp/pd_v04
          test -f /tmp/pd_v04/PunisherDrive/Resources/vehicle_profiles.json
          mkdir -p PunisherAndroid/app/src/main/assets/vehicles
          cp /tmp/pd_v04/PunisherDrive/Resources/vehicle_profiles.json PunisherAndroid/app/src/main/assets/vehicle_profiles.json
          python3 - <<'PY'
          import json
          p="PunisherAndroid/app/src/main/assets/vehicle_profiles.json"
          with open(p,encoding="utf-8") as f:data=json.load(f)
          assert len(data)==56,len(data)
          with open("PunisherAndroid/app/src/main/assets/vehicle_profiles.js","w",encoding="utf-8") as f:
              f.write("window.VEHICLE_PROFILES=")
              json.dump(data,f,ensure_ascii=False,separators=(",",":"))
              f.write(";")
          PY

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          python3 -m venv /tmp/pdvenv
          source /tmp/pdvenv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pillow rembg onnxruntime opencv-python-headless numpy

      - name: Build approved Punisher logo assets
        run: |
          set -euo pipefail
          rsvg-convert -w 1024 -h 1024 standalone/v07/assets/PunisherMark.svg -o PunisherAndroid/app/src/main/assets/punisher_mark.png
          rm -f PunisherAndroid/app/src/main/res/drawable/ic_launcher.xml
          cp PunisherAndroid/app/src/main/assets/punisher_mark.png PunisherAndroid/app/src/main/res/drawable/ic_launcher.png
          test -s PunisherAndroid/app/src/main/assets/punisher_mark.png

      - name: Prepare 56 clean transparent vehicle images
        run: |
          set -euo pipefail
          source /tmp/pdvenv/bin/activate
          python <<'PY'
          import io,json,os,time,urllib.parse,urllib.request
          from PIL import Image
          from rembg import remove,new_session

          with open("PunisherAndroid/app/src/main/assets/vehicle_profiles.json",encoding="utf-8") as f:
              profiles=json.load(f)
          assert len(profiles)==56
          out="PunisherAndroid/app/src/main/assets/vehicles"
          masks="PunisherAndroid/app/src/main/assets/vehicle_masks"
          os.makedirs(out,exist_ok=True)
          os.makedirs(masks,exist_ok=True)
          headers={"User-Agent":"PunisherDriveAndroid/0.3.4"}
          session=new_session("u2netp")

          def url(q):
              return "https://tse1.mm.bing.net/th?q="+urllib.parse.quote_plus(q)+"&w=1600&h=1050&c=7&rs=1&p=0"
          def get(u):
              req=urllib.request.Request(u,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as r:data=r.read()
              if len(data)<7000:raise RuntimeError("small image")
              return data
          def clean(data):
              try:
                  raw=remove(data,session=session)
                  im=Image.open(io.BytesIO(raw)).convert("RGBA")
              except Exception:
                  im=Image.open(io.BytesIO(data)).convert("RGBA")
                  pix=im.load()
                  for y in range(im.height):
                      for x in range(im.width):
                          r,g,b,a=pix[x,y]
                          if r>238 and g>238 and b>238:pix[x,y]=(r,g,b,0)
              bb=im.getbbox()
              if bb:im=im.crop(bb)
              canvas=Image.new("RGBA",(1500,1000),(0,0,0,0))
              scale=min(1380/im.width,900/im.height)
              nw,nh=max(1,int(im.width*scale)),max(1,int(im.height*scale))
              im=im.resize((nw,nh),Image.Resampling.LANCZOS)
              canvas.alpha_composite(im,((1500-nw)//2,(1000-nh)//2))
              return canvas

          done=0
          for i,p in enumerate(profiles,1):
              asset=p["assetKey"];make=p["make"];model=p["model"];gen=p.get("generation","")
              queries=[
                  f"{make} {model} {gen} white front three quarter view transparent png",
                  f"{make} {model} {gen} silver front 3/4 studio car",
                  f"{make} {model} white front three quarter"
              ]
              car=None
              for q in queries:
                  try:
                      d=get(url(q)); c=clean(d)
                      bb=c.getbbox()
                      if bb and bb[2]-bb[0]>500:
                          car=c;break
                  except Exception as e:
                      print("retry",asset,e)
              if car is None:raise RuntimeError("failed "+asset)
              car.save(os.path.join(out,asset+".png"),optimize=True)

              done+=1
              print(f"[{i:02d}/56] {asset}")
              time.sleep(.04)
          if done!=56:raise SystemExit("count mismatch")
          PY
          test "$(find PunisherAndroid/app/src/main/assets/vehicles -type f -name '*.png' | wc -l | tr -d ' ')" -eq 56

      - name: Visual AI body masks and plate fitting
        run: |
          set -euo pipefail
          source /tmp/pdvenv/bin/activate
          python <<'PY'
          import json,os
          import cv2
          import numpy as np
          from PIL import Image

          with open("PunisherAndroid/app/src/main/assets/vehicle_profiles.json",encoding="utf-8") as f:
              profiles=json.load(f)
          cars="PunisherAndroid/app/src/main/assets/vehicles"
          masks="PunisherAndroid/app/src/main/assets/vehicle_masks"
          os.makedirs(masks,exist_ok=True)
          meta=[]

          def make_mask(img):
              rgba=np.array(img.convert("RGBA"))
              rgb=rgba[:,:,:3]; alpha=rgba[:,:,3]
              hsv=cv2.cvtColor(rgb,cv2.COLOR_RGB2HSV)
              gray=cv2.cvtColor(rgb,cv2.COLOR_RGB2GRAY)
              _,s,v=cv2.split(hsv)
              body=cv2.bitwise_and(cv2.inRange(v,95,255),cv2.inRange(s,0,125))
              body=cv2.bitwise_and(body,alpha)
              body=cv2.morphologyEx(body,cv2.MORPH_CLOSE,np.ones((13,13),np.uint8),iterations=2)
              body=cv2.GaussianBlur(body,(0,0),3.2)
              shade=np.clip((gray.astype(np.float32)-45.0)/170.0,0,1)
              return (body.astype(np.float32)*shade).clip(0,255).astype(np.uint8)

          def plate_fit(img):
              rgba=np.array(img.convert("RGBA")); rgb=rgba[:,:,:3]; alpha=rgba[:,:,3]
              ys,xs=np.where(alpha>20)
              if len(xs)<100:return (0.70,0.705,0.235,0.105,-1.5,0.25)
              x0,x1=int(xs.min()),int(xs.max());y0,y1=int(ys.min()),int(ys.max())
              gray=cv2.cvtColor(rgb,cv2.COLOR_RGB2GRAY);sat=cv2.cvtColor(rgb,cv2.COLOR_RGB2HSV)[:,:,1]
              rx0=int(x0+(x1-x0)*.48);rx1=int(x0+(x1-x0)*.94)
              ry0=int(y0+(y1-y0)*.48);ry1=int(y0+(y1-y0)*.86)
              bw=cv2.bitwise_and(cv2.inRange(gray[ry0:ry1,rx0:rx1],145,255),cv2.inRange(sat[ry0:ry1,rx0:rx1],0,100))
              bw=cv2.morphologyEx(bw,cv2.MORPH_CLOSE,np.ones((5,9),np.uint8),iterations=2)
              contours,_=cv2.findContours(bw,cv2.RETR_EXTERNAL,cv2.CHAIN_APPROX_SIMPLE)
              area_total=max(1,(x1-x0)*(y1-y0));best=None;best_score=-1e9
              for cnt in contours:
                  rect=cv2.minAreaRect(cnt);(cx,cy),(rw,rh),angle=rect
                  if rw<1 or rh<1:continue
                  long=max(rw,rh);short=min(rw,rh);aspect=long/max(short,1);area=rw*rh
                  if not (1.7<=aspect<=7.5):continue
                  if not (.0012*area_total<=area<=.055*area_total):continue
                  gx=rx0+cx;gy=ry0+cy
                  nx=(gx-x0)/max(1,(x1-x0));ny=(gy-y0)/max(1,(y1-y0))
                  score=-abs(nx-.70)*3-abs(ny-.70)*2.5-abs(aspect-3.8)*.16+min(area/(.012*area_total),1)
                  if score>best_score:best_score=score;best=(long,short,angle,nx,ny)
              if best is None:return (.70,.705,.235,.105,-1.5,.34)
              long,short,angle,nx,ny=best
              pw=float(np.clip(long/max(1,(x1-x0))*1.25,.16,.30))
              ph=float(np.clip(short/max(1,(y1-y0))*1.35,.065,.15))
              pa=float(np.clip(angle if abs(angle)<=18 else 0,-8,8))
              conf=float(np.clip(.55+best_score*.08,.35,.94))
              return (float(np.clip(nx,.50,.88)),float(np.clip(ny,.52,.82)),pw,ph,pa,conf)

          for p in profiles:
              asset=p["assetKey"]
              img=Image.open(os.path.join(cars,asset+".png")).convert("RGBA")
              mask=make_mask(img)
              Image.fromarray(mask,"L").save(os.path.join(masks,asset+".png"),optimize=True)
              px,py,pw,ph,angle,confidence=plate_fit(img)
              rgba=np.array(img);alpha=rgba[:,:,3]
              visible=rgba[alpha>20,:3] if np.any(alpha>20) else rgba[:,:,:3].reshape(-1,3)
              mean=float(np.mean(visible))
              strength=float(np.clip(.60+(mean/255.0)*.22,.62,.82))
              meta.append({"assetKey":asset,"plateX":round(px,4),"plateY":round(py,4),"plateW":round(pw,4),"plateH":round(ph,4),"plateAngle":round(angle,2),"colorStrength":round(strength,3),"confidence":round(confidence,3)})

          with open("PunisherAndroid/app/src/main/assets/vehicle_visual_ai.json","w",encoding="utf-8") as f:
              json.dump(meta,f,ensure_ascii=False,indent=2)
          with open("PunisherAndroid/app/src/main/assets/vehicle_visual_ai.js","w",encoding="utf-8") as f:
              f.write("window.VEHICLE_VISUAL_AI=")
              json.dump(meta,f,ensure_ascii=False,separators=(",",":"))
              f.write(";")
          assert len(meta)==56
          print("VISUAL_AI_COUNT",len(meta))
          PY
          test "$(find PunisherAndroid/app/src/main/assets/vehicle_masks -type f -name '*.png' | wc -l | tr -d ' ')" -eq 56
          test -s PunisherAndroid/app/src/main/assets/vehicle_visual_ai.js

      - name: Direction-aware Visual AI fit
        run: |
          set -euo pipefail
          source /tmp/pdvenv/bin/activate
          python standalone/v13/visual_ai_fit.py \
            --profiles PunisherAndroid/app/src/main/assets/vehicle_profiles.json \
            --input-root PunisherAndroid/app/src/main/assets/vehicles \
            --mask-root PunisherAndroid/app/src/main/assets/vehicle_masks \
            --metadata PunisherAndroid/app/src/main/assets/vehicle_visual_ai.json \
            --mode directory \
            --js PunisherAndroid/app/src/main/assets/vehicle_visual_ai.js

      - name: Patch Android visual canvas and plate text
        run: |
          set -euo pipefail
          python standalone/v11/android_patch.py
          python standalone/v13/android_plate_patch.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: PunisherAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="PunisherAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "PUNISHER-DRIVE-ANDROID-0.3.4-8.apk"
          ls -lh PUNISHER-DRIVE-ANDROID-0.3.4-8.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-ANDROID-0.3.4-8-APK
          path: PUNISHER-DRIVE-ANDROID-0.3.4-8.apk
          if-no-files-found: error

name: Build Punisher Drive Android APK

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "PunisherAndroid/**"
      - "standalone/v04/**"
      - ".github/workflows/build-punisher-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore vehicle catalog
        run: |
          set -euo pipefail
          cat standalone/v04/part00.b64 standalone/v04/part01.b64 standalone/v04/part02.b64 standalone/v04/part03.b64 standalone/v04/part04.b64 > /tmp/pd_v04.b64
          base64 -d /tmp/pd_v04.b64 > /tmp/pd_v04.zip
          rm -rf /tmp/pd_v04
          mkdir -p /tmp/pd_v04
          unzip -oq /tmp/pd_v04.zip -d /tmp/pd_v04
          test -f /tmp/pd_v04/PunisherDrive/Resources/vehicle_profiles.json
          mkdir -p PunisherAndroid/app/src/main/assets/vehicles
          cp /tmp/pd_v04/PunisherDrive/Resources/vehicle_profiles.json PunisherAndroid/app/src/main/assets/vehicle_profiles.json
          python3 - <<'PY'
          import json
          p="PunisherAndroid/app/src/main/assets/vehicle_profiles.json"
          with open(p,encoding="utf-8") as f: data=json.load(f)
          assert len(data)==56, len(data)
          with open("PunisherAndroid/app/src/main/assets/vehicle_profiles.js","w",encoding="utf-8") as f:
              f.write("window.VEHICLE_PROFILES=")
              json.dump(data,f,ensure_ascii=False,separators=(",",":"))
              f.write(";")
          print("profiles",len(data))
          PY

      - name: Download 56 bundled vehicle images
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          with open("PunisherAndroid/app/src/main/assets/vehicle_profiles.json",encoding="utf-8") as f:
              profiles=json.load(f)
          out="PunisherAndroid/app/src/main/assets/vehicles"
          os.makedirs(out,exist_ok=True)
          headers={"User-Agent":"PunisherDriveAndroid/0.1.0"}
          ok=0

          def get_json(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.load(r)

          def wiki(query):
              params={
                  "action":"query","generator":"search","gsrsearch":query,"gsrnamespace":"0","gsrlimit":"8",
                  "prop":"pageimages","piprop":"thumbnail","pithumbsize":"1400","format":"json","origin":"*"
              }
              data=get_json("https://en.wikipedia.org/w/api.php?"+urllib.parse.urlencode(params))
              pages=list((data.get("query") or {}).get("pages",{}).values())
              pages.sort(key=lambda x:x.get("index",999))
              for p in pages:
                  u=(p.get("thumbnail") or {}).get("source")
                  if u and "logo" not in u.lower() and "badge" not in u.lower():
                      return u
              return None

          def bing(query):
              q=urllib.parse.quote_plus(query+" white car side view")
              return "https://tse1.mm.bing.net/th?q="+q+"&w=1200&h=700&c=7&rs=1&p=0"

          def download(url,dest):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:
                  data=r.read()
              if len(data)<5000: raise RuntimeError("small image")
              with open(dest,"wb") as f:f.write(data)

          for i,p in enumerate(profiles,1):
              asset=p["assetKey"]
              q=(p["make"]+" "+p["model"]+" "+p.get("generation","")+" automobile").strip()
              url=None
              try:url=wiki(q)
              except Exception as e:print("wiki warning",asset,e)
              if not url:url=bing(q)
              dest=os.path.join(out,asset+".jpg")
              try:
                  download(url,dest)
              except Exception:
                  download(bing(q),dest)
              ok+=1
              print(f"[{i:02d}/56] {asset}")
              time.sleep(.05)
          if ok!=56: raise SystemExit("vehicle image count mismatch")
          print("VEHICLE_IMAGE_COUNT",ok)
          PY
          test "$(find PunisherAndroid/app/src/main/assets/vehicles -type f -name '*.jpg' | wc -l | tr -d ' ')" -eq 56

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: PunisherAndroid
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="PunisherAndroid/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" "PUNISHER-DRIVE-ANDROID-0.1.0-1.apk"
          ls -lh PUNISHER-DRIVE-ANDROID-0.1.0-1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-ANDROID-0.1.0-1-APK
          path: PUNISHER-DRIVE-ANDROID-0.1.0-1.apk
          if-no-files-found: error

name: Build Punisher Drive Standalone v0.9.6 IPA

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "standalone/v04/**"
      - "standalone/v05/**"
      - "standalone/v06/**"
      - "standalone/v07/**"
      - "standalone/v08/**"
      - "standalone/v09/**"
      - "standalone/v10/**"
      - "standalone/v11/**"
      - "standalone/v12/**"
      - "standalone/v13/**"
      - "standalone/v14/**"
      - "standalone/v15/**"
      - "standalone/v16/**"
      - "standalone/v17/**"
      - "standalone/v18/**"
      - "standalone/v19/**"
      - "standalone/v20/**"
      - "standalone/tests/**"
      - ".github/workflows/build-ios-ipa.yml"

concurrency:
  group: punisher-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore standalone base and apply v0.7 UI
        run: |
          set -euo pipefail
          cat standalone/v04/part00.b64 standalone/v04/part01.b64 standalone/v04/part02.b64 standalone/v04/part03.b64 standalone/v04/part04.b64 > "$RUNNER_TEMP/pd_v04.b64"
          base64 -D -i "$RUNNER_TEMP/pd_v04.b64" -o "$RUNNER_TEMP/pd_v04.zip"
          rm -rf PunisherDrive PunisherDrive.xcodeproj project.yml
          unzip -oq "$RUNNER_TEMP/pd_v04.zip" -d .
          cp standalone/v20/project.yml project.yml
          cp standalone/v09/PunisherDriveApp.swift PunisherDrive/PunisherDriveApp.swift
          cp standalone/v07/LaunchSplashView.swift PunisherDrive/Views/LaunchSplashView.swift
          cp standalone/v07/PunisherBrand.swift PunisherDrive/Views/PunisherBrand.swift
          cp standalone/v10/RootView.swift PunisherDrive/Views/RootView.swift
          cp standalone/v10/GarageView.swift PunisherDrive/Views/GarageView.swift
          cp standalone/v10/VehicleProfileStore.swift PunisherDrive/Models/VehicleProfileStore.swift
          cp standalone/v14/VehicleAppearanceView.swift PunisherDrive/Views/VehicleAppearanceView.swift
          cp standalone/v20/VehicleAssetImage.swift PunisherDrive/Views/VehicleAssetImage.swift
          cp standalone/v18/AIPaintRenderer.swift PunisherDrive/Views/AIPaintRenderer.swift
          cp standalone/v20/IraqPlateData.swift PunisherDrive/Views/IraqPlateData.swift
          cp standalone/v09/FleetMapView.swift PunisherDrive/Views/FleetMapView.swift
          cp standalone/v10/SettingsView.swift PunisherDrive/Views/SettingsView.swift
          cp standalone/v09/VehiclePickerView.swift PunisherDrive/Views/VehiclePickerView.swift
          cp standalone/v09/AboutView.swift PunisherDrive/Views/AboutView.swift
          cp standalone/v09/PDLocalization.swift PunisherDrive/Views/PDLocalization.swift
          cp standalone/v11/VehicleVisualAI.swift PunisherDrive/Views/VehicleVisualAI.swift
          cp standalone/v09/SmartAIView.swift PunisherDrive/Views/SmartAIView.swift
          cp standalone/v10/CustomerDocumentsView.swift PunisherDrive/Views/CustomerDocumentsView.swift
          cp standalone/v10/CustomerServerSettingsView.swift PunisherDrive/Views/CustomerServerSettingsView.swift

      - name: Install image tools
        run: |
          brew install librsvg
          python3 -m venv "$RUNNER_TEMP/pdvenv"
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install pillow rembg onnxruntime opencv-python-headless numpy ultralytics huggingface_hub

      - name: Regression test - keep windows unpainted
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python standalone/tests/test_paint_mask.py

      - name: Build approved Punisher assets
        run: |
          set -euo pipefail
          mkdir -p PunisherDrive/Assets.xcassets/AppIcon.appiconset
          mkdir -p PunisherDrive/Assets.xcassets/PunisherMark.imageset

          rsvg-convert -w 1024 -h 1024 standalone/v07/assets/PunisherMark.svg -o "$RUNNER_TEMP/PunisherMark-1024.png"
          cp "$RUNNER_TEMP/PunisherMark-1024.png" PunisherDrive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          cp "$RUNNER_TEMP/PunisherMark-1024.png" PunisherDrive/Assets.xcassets/PunisherMark.imageset/PunisherMark.png

          cat > PunisherDrive/Assets.xcassets/Contents.json <<'JSON'
          {"info":{"author":"xcode","version":1}}
          JSON
          cat > PunisherDrive/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images":[{"filename":"AppIcon-1024.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info":{"author":"xcode","version":1}
          }
          JSON
          cat > PunisherDrive/Assets.xcassets/PunisherMark.imageset/Contents.json <<'JSON'
          {
            "images":[
              {"filename":"PunisherMark.png","idiom":"universal","scale":"1x"},
              {"idiom":"universal","scale":"2x"},
              {"idiom":"universal","scale":"3x"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSON

      - name: Prepare 56 clean transparent vehicle assets
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python <<'PY'
          import io, json, os, time, urllib.parse, urllib.request
          from PIL import Image
          from rembg import remove, new_session

          profiles_path="PunisherDrive/Resources/vehicle_profiles.json"
          assets_root="PunisherDrive/Assets.xcassets"
          with open(profiles_path,encoding="utf-8") as f:
              profiles=json.load(f)
          assert len(profiles)==56, len(profiles)

          headers={"User-Agent":"PunisherDriveAssets/0.8.0"}
          session=new_session("u2netp")

          def bing_url(q):
              qq=urllib.parse.quote_plus(q)
              return f"https://tse1.mm.bing.net/th?q={qq}&w=1600&h=1050&c=7&rs=1&p=0"

          def download(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=40) as r:
                  data=r.read()
              if len(data)<7000:
                  raise RuntimeError("image too small")
              return data

          def clean_asset(data):
              try:
                  out=remove(data,session=session)
                  im=Image.open(io.BytesIO(out)).convert("RGBA")
              except Exception:
                  im=Image.open(io.BytesIO(data)).convert("RGBA")
                  pix=im.load()
                  for y in range(im.height):
                      for x in range(im.width):
                          r,g,b,a=pix[x,y]
                          if r>238 and g>238 and b>238:
                              pix[x,y]=(r,g,b,0)
              bbox=im.getbbox()
              if bbox:
                  im=im.crop(bbox)
              canvas=Image.new("RGBA",(1500,1000),(0,0,0,0))
              maxw,maxh=1380,900
              scale=min(maxw/im.width,maxh/im.height)
              nw,nh=max(1,int(im.width*scale)),max(1,int(im.height*scale))
              im=im.resize((nw,nh),Image.Resampling.LANCZOS)
              x=(1500-nw)//2
              y=(1000-nh)//2
              canvas.alpha_composite(im,(x,y))
              return canvas

          manifest=[]
          for i,p in enumerate(profiles,1):
              asset=p["assetKey"]
              make=p["make"]; model=p["model"]; gen=p.get("generation","")
              queries=[
                  f"{make} {model} {gen} white front three quarter view transparent png",
                  f"{make} {model} {gen} silver front 3/4 studio car",
                  f"{make} {model} white front three quarter"
              ]
              last=None
              for q in queries:
                  try:
                      data=download(bing_url(q))
                      car=clean_asset(data)
                      if car.getbbox() and car.getbbox()[2]-car.getbbox()[0] > 500:
                          last=(q,car)
                          break
                  except Exception as e:
                      print("retry",asset,e)
              if not last:
                  raise RuntimeError(f"failed image {asset}")
              q,car=last
              imageset=os.path.join(assets_root,asset+".imageset")
              os.makedirs(imageset,exist_ok=True)
              dest=os.path.join(imageset,asset+".png")
              car.save(dest,optimize=True)
              with open(os.path.join(imageset,"Contents.json"),"w") as f:
                  json.dump({
                      "images":[
                          {"filename":asset+".png","idiom":"universal","scale":"1x"},
                          {"idiom":"universal","scale":"2x"},
                          {"idiom":"universal","scale":"3x"}
                      ],
                      "info":{"author":"xcode","version":1}
                  },f)
              manifest.append({"assetKey":asset,"query":q})
              print(f"[{i:02d}/56] {asset}")
              time.sleep(.04)

          with open("PunisherDrive/Resources/vehicle_image_sources.json","w") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          if len(manifest)!=56:
              raise SystemExit("expected 56 assets")
          PY
          test "$(find PunisherDrive/Assets.xcassets -maxdepth 1 -name '*.imageset' | grep -v PunisherMark | wc -l | tr -d ' ')" -eq 56

      - name: Visual AI body masks and plate fitting
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python <<'PY'
          import json, os
          import cv2
          import numpy as np
          from PIL import Image

          profiles_path="PunisherDrive/Resources/vehicle_profiles.json"
          assets_root="PunisherDrive/Assets.xcassets"
          with open(profiles_path,encoding="utf-8") as f:
              profiles=json.load(f)

          metadata=[]

          def body_mask(img):
              rgba=np.array(img.convert("RGBA"))
              rgb=rgba[:,:,:3]
              alpha=rgba[:,:,3]
              hsv=cv2.cvtColor(rgb,cv2.COLOR_RGB2HSV)
              gray=cv2.cvtColor(rgb,cv2.COLOR_RGB2GRAY)
              h,s,v=cv2.split(hsv)

              # Body panels in the source images are primarily white/silver.
              bright=cv2.inRange(v,95,255)
              low_sat=cv2.inRange(s,0,125)
              body=cv2.bitwise_and(bright,low_sat)
              body=cv2.bitwise_and(body,alpha)
              body=cv2.morphologyEx(body,cv2.MORPH_CLOSE,np.ones((13,13),np.uint8),iterations=2)
              body=cv2.GaussianBlur(body,(0,0),3.2)

              # Preserve panel shading while keeping glass/tires/grille mostly excluded.
              shade=np.clip((gray.astype(np.float32)-45.0)/170.0,0,1)
              mask=(body.astype(np.float32)*shade).clip(0,255).astype(np.uint8)
              return mask

          def plate_fit(img):
              rgba=np.array(img.convert("RGBA"))
              rgb=rgba[:,:,:3]
              alpha=rgba[:,:,3]
              h,w=alpha.shape
              ys,xs=np.where(alpha>20)
              if len(xs)<100:
                  return (0.70,0.705,0.235,0.105,-1.5,0.25)

              x0,x1=int(xs.min()),int(xs.max())
              y0,y1=int(ys.min()),int(ys.max())
              gray=cv2.cvtColor(rgb,cv2.COLOR_RGB2GRAY)
              hsv=cv2.cvtColor(rgb,cv2.COLOR_RGB2HSV)
              sat=hsv[:,:,1]

              # Search front lower region. Current standardized 3/4 assets point front toward right.
              rx0=int(x0+(x1-x0)*0.48); rx1=int(x0+(x1-x0)*0.94)
              ry0=int(y0+(y1-y0)*0.48); ry1=int(y0+(y1-y0)*0.86)
              crop_gray=gray[ry0:ry1,rx0:rx1]
              crop_sat=sat[ry0:ry1,rx0:rx1]

              bright=cv2.inRange(crop_gray,145,255)
              desat=cv2.inRange(crop_sat,0,100)
              bw=cv2.bitwise_and(bright,desat)
              bw=cv2.morphologyEx(bw,cv2.MORPH_CLOSE,np.ones((5,9),np.uint8),iterations=2)

              contours,_=cv2.findContours(bw,cv2.RETR_EXTERNAL,cv2.CHAIN_APPROX_SIMPLE)
              best=None
              best_score=-1e9
              area_total=max(1,(x1-x0)*(y1-y0))
              for cnt in contours:
                  rect=cv2.minAreaRect(cnt)
                  (cx,cy),(rw,rh),angle=rect
                  if rw<1 or rh<1: continue
                  long=max(rw,rh); short=min(rw,rh)
                  aspect=long/max(short,1)
                  area=rw*rh
                  if not (1.7<=aspect<=7.5): continue
                  if not (0.0012*area_total<=area<=0.055*area_total): continue

                  gx=rx0+cx; gy=ry0+cy
                  nx=(gx-x0)/max(1,(x1-x0))
                  ny=(gy-y0)/max(1,(y1-y0))
                  pos=-abs(nx-0.70)*3.0-abs(ny-0.70)*2.5
                  aspect_score=-abs(aspect-3.8)*0.16
                  area_score=min(area/(0.012*area_total),1.0)
                  score=pos+aspect_score+area_score
                  if score>best_score:
                      best_score=score
                      best=(gx,gy,long,short,angle,nx,ny)

              if best is None:
                  return (0.70,0.705,0.235,0.105,-1.5,0.34)

              gx,gy,long,short,angle,nx,ny=best
              pw=np.clip(long/max(1,(x1-x0))*1.25,0.16,0.30)
              ph=np.clip(short/max(1,(y1-y0))*1.35,0.065,0.15)
              # Normalize OpenCV angle to a small visual correction.
              pa=float(np.clip(angle if abs(angle)<=18 else 0,-8,8))
              conf=float(np.clip(0.55+best_score*0.08,0.35,0.94))
              return (float(np.clip(nx,0.50,0.88)),float(np.clip(ny,0.52,0.82)),float(pw),float(ph),pa,conf)

          for p in profiles:
              asset=p["assetKey"]
              src=os.path.join(assets_root,asset+".imageset",asset+".png")
              img=Image.open(src).convert("RGBA")

              mask=body_mask(img)
              maskset=os.path.join(assets_root,asset+"_bodymask.imageset")
              os.makedirs(maskset,exist_ok=True)
              maskname=asset+"_bodymask.png"
              Image.fromarray(mask,"L").save(os.path.join(maskset,maskname),optimize=True)
              with open(os.path.join(maskset,"Contents.json"),"w") as f:
                  json.dump({
                      "images":[
                          {"filename":maskname,"idiom":"universal","scale":"1x"},
                          {"idiom":"universal","scale":"2x"},
                          {"idiom":"universal","scale":"3x"}
                      ],
                      "info":{"author":"xcode","version":1}
                  },f)

              px,py,pw,ph,angle,confidence=plate_fit(img)
              # Stronger paint on light standardized source bodies.
              rgba=np.array(img)
              alpha=rgba[:,:,3]
              visible=rgba[alpha>20,:3] if np.any(alpha>20) else rgba[:,:,:3].reshape(-1,3)
              mean=float(np.mean(visible))
              strength=float(np.clip(0.60+(mean/255.0)*0.22,0.62,0.82))
              metadata.append({
                  "assetKey":asset,
                  "plateX":round(px,4),"plateY":round(py,4),
                  "plateW":round(pw,4),"plateH":round(ph,4),
                  "plateAngle":round(angle,2),
                  "colorStrength":round(strength,3),
                  "confidence":round(confidence,3)
              })

          with open("PunisherDrive/Resources/vehicle_visual_ai.json","w",encoding="utf-8") as f:
              json.dump(metadata,f,ensure_ascii=False,indent=2)
          assert len(metadata)==56
          print("VISUAL_AI_COUNT",len(metadata))
          PY
          test "$(find PunisherDrive/Assets.xcassets -maxdepth 1 -name '*_bodymask.imageset' | wc -l | tr -d ' ')" -eq 56
          test -s PunisherDrive/Resources/vehicle_visual_ai.json

      - name: Direction-aware Visual AI fit
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python standalone/v14/visual_ai_fit.py \
            --profiles PunisherDrive/Resources/vehicle_profiles.json \
            --input-root PunisherDrive/Assets.xcassets \
            --mask-root PunisherDrive/Assets.xcassets \
            --metadata PunisherDrive/Resources/vehicle_visual_ai.json \
            --mode xcassets
          test -s PunisherDrive/Resources/vehicle_visual_ai.json

      - name: Dedicated AI license plate detector
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python standalone/v18/plate_detector_v2.py \
            --profiles PunisherDrive/Resources/vehicle_profiles.json \
            --input-root PunisherDrive/Assets.xcassets \
            --metadata PunisherDrive/Resources/vehicle_visual_ai.json \
            --mode xcassets
          test -s PunisherDrive/Resources/vehicle_visual_ai.json

      - name: AI Paint v4 full paint replacement masks
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/pdvenv/bin/activate"
          python standalone/v20/ai_paint_v4_2.py \
            --profiles PunisherDrive/Resources/vehicle_profiles.json \
            --input-root PunisherDrive/Assets.xcassets \
            --mask-root PunisherDrive/Assets.xcassets \
            --mode xcassets
          test "$(find PunisherDrive/Assets.xcassets -maxdepth 1 -name '*_bodymask.imageset' | wc -l | tr -d ' ')" -eq 56

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/PunisherDerived"
          xcodebuild             -project PunisherDrive.xcodeproj             -scheme PunisherDrive             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/PunisherDerived"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Verify icon and sign app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/PunisherDrive.app"
          test -d "$APP"
          test -f "$APP/Assets.car"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package test IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/PunisherDrive.app"
          rm -rf "$RUNNER_TEMP/punisher-ipa"
          mkdir -p "$RUNNER_TEMP/punisher-ipa/Payload"
          /usr/bin/ditto "$APP" "$RUNNER_TEMP/punisher-ipa/Payload/PunisherDrive.app"
          cd "$RUNNER_TEMP/punisher-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PUNISHER-DRIVE-IOS-0.9.6-26-TEST.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/PUNISHER-DRIVE-IOS-0.9.6-26-TEST.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-IOS-0.9.6-26-TEST-IPA
          path: PUNISHER-DRIVE-IOS-0.9.6-26-TEST.ipa
          if-no-files-found: error

name: Build Punisher Drive Standalone v0.4 IPA

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "standalone/v04/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore Punisher Drive v0.4 source
        run: |
          set -euo pipefail
          cat standalone/v04/part00.b64 standalone/v04/part01.b64 standalone/v04/part02.b64 standalone/v04/part03.b64 standalone/v04/part04.b64 > "$RUNNER_TEMP/pd_v04.b64"
          base64 -D -i "$RUNNER_TEMP/pd_v04.b64" -o "$RUNNER_TEMP/pd_v04.zip"
          rm -rf PunisherDrive PunisherDrive.xcodeproj project.yml
          unzip -oq "$RUNNER_TEMP/pd_v04.zip" -d .
          test -f project.yml
          test -f PunisherDrive/PunisherDriveApp.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path("PunisherDrive/Views/GarageView.swift")
          s = p.read_text()
          s = s.replace(".foregroundStyle(vehicle.hasESP ? .secondary : .orange)", ".foregroundStyle(vehicle.hasESP ? Color.secondary : Color.orange)")
          p.write_text(s)
          PY

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/PunisherDerived"
          xcodebuild             -project PunisherDrive.xcodeproj             -scheme PunisherDrive             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/PunisherDerived"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/PunisherDrive.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          mkdir -p "$RUNNER_TEMP/punisher-ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/punisher-ipa/Payload/PunisherDrive.app"
          cd "$RUNNER_TEMP/punisher-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PUNISHER-DRIVE-0.4.0-4-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-0.4.0-4-unsigned-IPA
          path: PUNISHER-DRIVE-0.4.0-4-unsigned.ipa
          if-no-files-found: error

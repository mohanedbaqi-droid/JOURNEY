name: Build Punisher Drive unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -project JourneyControl.xcodeproj -scheme JourneyControl -resolvePackageDependencies

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/PunisherDerived"
          xcodebuild \
            -project JourneyControl.xcodeproj \
            -scheme JourneyControl \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PunisherDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/JourneyControl.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/punisher-ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/punisher-ipa/Payload/PunisherDrive.app"
          cd "$RUNNER_TEMP/punisher-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PUNISHER-DRIVE-0.1.0-1-unsigned.ipa" Payload
          test -f "$GITHUB_WORKSPACE/PUNISHER-DRIVE-0.1.0-1-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-0.1.0-1-unsigned-IPA
          path: PUNISHER-DRIVE-0.1.0-1-unsigned.ipa
          if-no-files-found: error

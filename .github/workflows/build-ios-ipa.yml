name: Build Punisher Drive unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "ios/**"
      - "punisher/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply Punisher Drive source patch
        run: |
          set -euo pipefail
          test -f punisher/punisher-ios.patch
          git apply --check punisher/punisher-ios.patch
          git apply punisher/punisher-ios.patch

      - name: Check telemetry decoder
        run: |
          swiftc ios/JourneyControl/Models/VehicleState.swift ios/Tests/TelemetryDecoderTests.swift -o "$RUNNER_TEMP/decoder-tests"
          "$RUNNER_TEMP/decoder-tests"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -project JourneyControl.xcodeproj -scheme JourneyControl -resolvePackageDependencies

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project JourneyControl.xcodeproj \
            -scheme JourneyControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/PunisherDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/JourneyControl.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/JourneyControl"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/JourneyControl.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PUNISHER-DRIVE-0.1.0-1-unsigned.ipa" Payload
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-0.1.0-1-unsigned-IPA
          path: PUNISHER-DRIVE-0.1.0-1-unsigned.ipa
          if-no-files-found: error

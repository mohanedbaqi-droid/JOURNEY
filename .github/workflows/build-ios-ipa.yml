name: Build JOURNEY DEMO iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ios-demo-car-states]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check car image integrity
        run: python3 ios/Tests/verify_car_assets.py

      - name: Check telemetry decoder
        run: |
          swiftc ios/JourneyControl/Models/VehicleState.swift ios/Tests/TelemetryDecoderTests.swift -o "$RUNNER_TEMP/decoder-tests"
          "$RUNNER_TEMP/decoder-tests"

      - name: Check demo simulation
        run: |
          swiftc ios/JourneyControl/Models/VehicleState.swift ios/JourneyControl/Models/DemoVehicleSimulation.swift ios/Tests/DemoSimulationTests.swift -o "$RUNNER_TEMP/demo-tests"
          "$RUNNER_TEMP/demo-tests"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -project JourneyControl.xcodeproj -scheme JourneyControl -resolvePackageDependencies

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project JourneyControl.xcodeproj \
            -scheme JourneyControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/JourneyDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package real IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/JourneyDerived/Build/Products/Release-iphoneos/JourneyControl.app"
          APP_INFO="$APP/Info.plist"
          WIDGET_INFO="$APP/PlugIns/JourneyWidget.appex/Info.plist"
          test -d "$APP"
          test -f "$APP_INFO"
          test -f "$APP/JourneyControl"
          test -f "$WIDGET_INFO"
          test -f "$APP/PlugIns/JourneyWidget.appex/JourneyWidget"
          python3 ios/Tests/verify_widget_binary.py "$APP"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "com.abuseif.journey.demo"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_INFO")" = "JOURNEY DEMO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_INFO")" = "com.abuseif.journey.demo.widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$WIDGET_INFO")" = "JOURNEY DEMO"

          # These are now compiled from the source plist, not patched afterwards.
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_INFO" | grep "^com.apple.widgetkit-extension$"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/JourneyControl.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/JOURNEY-DEMO-2.4.28-60-unsigned.ipa" Payload
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/JOURNEY-DEMO-2.4.28-60-unsigned.ipa" | grep "Payload/JourneyControl.app/Info.plist"
          /usr/bin/unzip -p "$GITHUB_WORKSPACE/JOURNEY-DEMO-2.4.28-60-unsigned.ipa" "Payload/JourneyControl.app/Info.plist" > "$RUNNER_TEMP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$RUNNER_TEMP/Info.plist"
          /usr/bin/unzip -p "$GITHUB_WORKSPACE/JOURNEY-DEMO-2.4.28-60-unsigned.ipa" "Payload/JourneyControl.app/PlugIns/JourneyWidget.appex/Info.plist" > "$RUNNER_TEMP/Widget-Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$RUNNER_TEMP/Widget-Info.plist" | grep "^com.apple.widgetkit-extension$"
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/JOURNEY-DEMO-2.4.28-60-unsigned.ipa" | grep "Payload/JourneyControl.app/JourneyControl"

      - uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-DEMO-2.4.28-60-unsigned-IPA
          path: JOURNEY-DEMO-2.4.28-60-unsigned.ipa
          if-no-files-found: error

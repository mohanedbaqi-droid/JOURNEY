name: Build JOURNEY iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, journey-main-real-doors, journey-android-real-state, journey-waveshare-complete-20261013]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Check car image integrity
        run: python3 ios/Tests/verify_car_assets.py

      - name: Check telemetry decoder
        run: |
          swiftc ios/JourneyControl/Models/VehicleState.swift ios/JourneyControl/Models/VehicleCommand.swift ios/Tests/TelemetryDecoderTests.swift -o "$RUNNER_TEMP/decoder-tests"
          "$RUNNER_TEMP/decoder-tests"

      - name: Check widget data freshness
        run: |
          swiftc ios/Shared/JourneyWidgetData.swift ios/Tests/WidgetSnapshotTests.swift -o "$RUNNER_TEMP/widget-tests"
          "$RUNNER_TEMP/widget-tests"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -project JourneyControl.xcodeproj -scheme JourneyControl -resolvePackageDependencies

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project JourneyControl.xcodeproj \
            -scheme JourneyControl \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/JourneyDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package real IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/JourneyDerived/Build/Products/Release-iphoneos/JourneyControl.app"
          APP_INFO="$APP/Info.plist"
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO")"
          IPA_FILENAME="JOURNEY-${APP_VERSION}-${APP_BUILD}-unsigned.ipa"
          echo "IPA_FILENAME=$IPA_FILENAME" >> "$GITHUB_ENV"
          echo "IPA_ARTIFACT=JOURNEY-${APP_VERSION}-${APP_BUILD}-unsigned-IPA" >> "$GITHUB_ENV"
          WIDGET_INFO="$APP/PlugIns/JourneyWidget.appex/Info.plist"
          test -d "$APP"
          test -f "$APP_INFO"
          test -f "$APP/JourneyControl"
          test -f "$WIDGET_INFO"
          test "$APP_VERSION" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WIDGET_INFO")"
          test "$APP_BUILD" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WIDGET_INFO")"
          test -f "$APP/PlugIns/JourneyWidget.appex/JourneyWidget"

          # Restore the companion Watch app after App ID slots became available.
          WATCH_APP="$APP/Watch/JourneyWatch.app"
          WATCH_INFO="$WATCH_APP/Info.plist"
          test -f "$WATCH_APP/JourneyWatch"
          test "$APP_VERSION" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$WATCH_INFO")"
          test "$APP_BUILD" = "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$WATCH_INFO")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH_INFO")" = "com.abuseif.journey.watchkitapp"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH_INFO")" = "com.abuseif.journey"
          python3 ios/Tests/verify_widget_binary.py "$APP"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO")" = "com.abuseif.journey"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_INFO")" = "JOURNEY"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WIDGET_INFO")" = "com.abuseif.journey.widget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$WIDGET_INFO")" = "JOURNEY"

          # These are now compiled from the source plist, not patched afterwards.
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_INFO" | grep "^com.apple.widgetkit-extension$"

          # Preserve desired App Group entitlements for the installation signing tool.
          codesign --force --sign - --entitlements ios/JourneyWidget/JourneyWidget.entitlements "$APP/PlugIns/JourneyWidget.appex"
          # SideStore appends this owner signing team to the iPhone bundle ID.
          # Keep the Watch companion reference aligned with that installed ID.
          /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier com.abuseif.journey.6778LWD4ZB" "$WATCH_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$WATCH_INFO")" = "com.abuseif.journey.6778LWD4ZB"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.abuseif.journey.6778LWD4ZB.watchkitapp" "$WATCH_INFO"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$WATCH_INFO")" = "com.abuseif.journey.6778LWD4ZB.watchkitapp"
          codesign --force --sign - "$WATCH_APP"
          codesign --force --sign - --entitlements ios/JourneyControl/JourneyControl.entitlements "$APP"
          codesign -d --entitlements :- "$APP"
          codesign -d --entitlements :- "$APP/PlugIns/JourneyWidget.appex"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/JourneyControl.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/$IPA_FILENAME" Payload
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/$IPA_FILENAME" | grep "Payload/JourneyControl.app/Info.plist"
          /usr/bin/unzip -p "$GITHUB_WORKSPACE/$IPA_FILENAME" "Payload/JourneyControl.app/Info.plist" > "$RUNNER_TEMP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$RUNNER_TEMP/Info.plist"
          /usr/bin/unzip -p "$GITHUB_WORKSPACE/$IPA_FILENAME" "Payload/JourneyControl.app/PlugIns/JourneyWidget.appex/Info.plist" > "$RUNNER_TEMP/Widget-Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$RUNNER_TEMP/Widget-Info.plist" | grep "^com.apple.widgetkit-extension$"
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/$IPA_FILENAME" | grep "Payload/JourneyControl.app/JourneyControl"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_ARTIFACT }}
          path: ${{ env.IPA_FILENAME }}
          if-no-files-found: error

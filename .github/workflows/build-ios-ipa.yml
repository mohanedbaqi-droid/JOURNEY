name: Build Punisher Drive Standalone v0.6.3 IPA

on:
  workflow_dispatch:
  push:
    branches: [punisher-drive]
    paths:
      - "standalone/v04/**"
      - "standalone/v05/**"
      - "standalone/v06/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore standalone base and apply v0.6 UI
        run: |
          set -euo pipefail
          cat standalone/v04/part00.b64 standalone/v04/part01.b64 standalone/v04/part02.b64 standalone/v04/part03.b64 standalone/v04/part04.b64 > "$RUNNER_TEMP/pd_v04.b64"
          base64 -D -i "$RUNNER_TEMP/pd_v04.b64" -o "$RUNNER_TEMP/pd_v04.zip"
          rm -rf PunisherDrive PunisherDrive.xcodeproj project.yml
          unzip -oq "$RUNNER_TEMP/pd_v04.zip" -d .
          cp standalone/v06/project.yml project.yml
          cp standalone/v06/RootView.swift PunisherDrive/Views/RootView.swift
          cp standalone/v06/GarageView.swift PunisherDrive/Views/GarageView.swift
          cp standalone/v06/VehicleProfileStore.swift PunisherDrive/Models/VehicleProfileStore.swift
          cp standalone/v06/VehicleAppearanceView.swift PunisherDrive/Views/VehicleAppearanceView.swift
          cp standalone/v06/VehicleAssetImage.swift PunisherDrive/Views/VehicleAssetImage.swift
          cp standalone/v06/FleetMapView.swift PunisherDrive/Views/FleetMapView.swift
                    cp standalone/v06/SettingsView.swift PunisherDrive/Views/SettingsView.swift
          cp standalone/v05/VehiclePickerView.swift PunisherDrive/Views/VehiclePickerView.swift
          cp standalone/v06/AboutView.swift PunisherDrive/Views/AboutView.swift
          cp standalone/v06/PunisherBrand.swift PunisherDrive/Views/PunisherBrand.swift
          test -f PunisherDrive/PunisherDriveApp.swift

      - name: Generate Punisher red-cyan app icon
        run: |
          set -euo pipefail
          mkdir -p PunisherDrive/Assets.xcassets/AppIcon.appiconset
          cat > PunisherDrive/Assets.xcassets/Contents.json <<'JSON'
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          cat > PunisherDrive/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          cat > "$RUNNER_TEMP/make_icon.swift" <<'SWIFT'
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()
          let rect = NSRect(origin: .zero, size: size)
          NSGradient(
            colors: [
              NSColor(calibratedRed: 0.005, green: 0.008, blue: 0.015, alpha: 1),
              NSColor(calibratedRed: 0.075, green: 0.005, blue: 0.012, alpha: 1),
              NSColor(calibratedRed: 0.0, green: 0.08, blue: 0.12, alpha: 1)
            ]
          )!.draw(in: rect, angle: -55)

          let ring = NSBezierPath(ovalIn: NSRect(x: 108, y: 108, width: 808, height: 808))
          ring.lineWidth = 28
          NSColor(calibratedRed: 0.0, green: 0.78, blue: 1.0, alpha: 0.72).setStroke()
          ring.stroke()

          let arc = NSBezierPath()
          arc.appendArc(withCenter: NSPoint(x: 512, y: 512), radius: 404, startAngle: 28, endAngle: 152)
          arc.lineWidth = 34
          arc.lineCapStyle = .round
          NSColor(calibratedRed: 1.0, green: 0.05, blue: 0.04, alpha: 0.94).setStroke()
          arc.stroke()

          let skull = "☠" as NSString
          let attrs: [NSAttributedString.Key: Any] = [
            .font: NSFont.systemFont(ofSize: 620, weight: .black),
            .foregroundColor: NSColor(calibratedRed: 0.94, green: 0.05, blue: 0.035, alpha: 1)
          ]
          let s = skull.size(withAttributes: attrs)
          skull.draw(at: NSPoint(x: (1024-s.width)/2, y: 190), withAttributes: attrs)

          image.unlockFocus()
          guard let tiff = image.tiffRepresentation,
                let rep = NSBitmapImageRep(data: tiff),
                let png = rep.representation(using: .png, properties: [.compressionFactor: 1.0]) else {
            fatalError("icon generation failed")
          }
          try png.write(to: URL(fileURLWithPath: "PunisherDrive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"))
          SWIFT
          swift "$RUNNER_TEMP/make_icon.swift"
          test -s PunisherDrive/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Download 56 vehicle images into assets
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, time, urllib.parse, urllib.request, subprocess

          profiles_path = "PunisherDrive/Resources/vehicle_profiles.json"
          assets_root = "PunisherDrive/Assets.xcassets"
          os.makedirs(assets_root, exist_ok=True)

          with open(profiles_path, "r", encoding="utf-8") as f:
              profiles = json.load(f)

          headers = {"User-Agent": "PunisherDriveVehicleAssets/0.6.3 (GitHub Actions)"}
          manifest = []
          failures = []

          def fetch_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.load(r)

          def image_from_wikipedia(query):
              params = {
                  "action": "query",
                  "generator": "search",
                  "gsrsearch": query,
                  "gsrnamespace": "0",
                  "gsrlimit": "8",
                  "prop": "pageimages|info",
                  "piprop": "thumbnail|original",
                  "pithumbsize": "1400",
                  "inprop": "url",
                  "format": "json",
                  "origin": "*",
              }
              url = "https://en.wikipedia.org/w/api.php?" + urllib.parse.urlencode(params)
              data = fetch_json(url)
              pages = list((data.get("query") or {}).get("pages", {}).values())
              pages.sort(key=lambda p: p.get("index", 9999))
              for page in pages:
                  thumb = (page.get("thumbnail") or {}).get("source")
                  if thumb and "logo" not in thumb.lower() and "badge" not in thumb.lower():
                      return thumb, page.get("fullurl") or "", page.get("title") or query
              return None

          def image_from_bing(query):
              q = urllib.parse.quote_plus(query + " white car side view")
              return f"https://tse1.mm.bing.net/th?q={q}&w=1200&h=700&c=7&rs=1&p=0", "https://www.bing.com/images/search?q=" + q, query

          def download(url, dest):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=35) as r:
                  ctype = (r.headers.get("Content-Type") or "").lower()
                  data = r.read()
              if len(data) < 5000:
                  raise RuntimeError(f"image too small: {len(data)} bytes")
              tmp = dest + ".download"
              with open(tmp, "wb") as f:
                  f.write(data)
              subprocess.run(["sips", "-s", "format", "jpeg", tmp, "--out", dest], check=True,
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              os.remove(tmp)
              if os.path.getsize(dest) < 5000:
                  raise RuntimeError("converted image too small")

          for idx, profile in enumerate(profiles, 1):
              asset = profile["assetKey"]
              make = profile["make"]
              model = profile["model"]
              generation = profile.get("generation", "")
              queries = [
                  f"{make} {model} {generation} automobile",
                  f"{make} {model} car",
              ]

              chosen = None
              for query in queries:
                  try:
                      chosen = image_from_wikipedia(query)
                  except Exception as e:
                      print(f"[WARN] Wikipedia {asset}: {e}")
                  if chosen:
                      break

              if not chosen:
                  chosen = image_from_bing(f"{make} {model} {generation}")

              imageset = os.path.join(assets_root, asset + ".imageset")
              os.makedirs(imageset, exist_ok=True)
              dest = os.path.join(imageset, asset + ".jpg")
              source_url = chosen[1]
              source_title = chosen[2]

              try:
                  download(chosen[0], dest)
              except Exception as first_error:
                  print(f"[WARN] primary image failed {asset}: {first_error}")
                  try:
                      fallback = image_from_bing(f"{make} {model} {generation}")
                      download(fallback[0], dest)
                      source_url, source_title = fallback[1], fallback[2]
                  except Exception as second_error:
                      failures.append((asset, str(second_error)))
                      print(f"[FAIL] {asset}: {second_error}")
                      continue

              contents = {
                  "images": [
                      {"filename": asset + ".jpg", "idiom": "universal", "scale": "1x"},
                      {"idiom": "universal", "scale": "2x"},
                      {"idiom": "universal", "scale": "3x"}
                  ],
                  "info": {"author": "xcode", "version": 1}
              }
              with open(os.path.join(imageset, "Contents.json"), "w", encoding="utf-8") as f:
                  json.dump(contents, f, ensure_ascii=False, indent=2)

              manifest.append({
                  "assetKey": asset,
                  "make": make,
                  "model": model,
                  "source": source_url,
                  "sourceTitle": source_title
              })
              print(f"[{idx:02d}/{len(profiles)}] {asset} OK")
              time.sleep(0.08)

          manifest_path = "PunisherDrive/Resources/vehicle_image_sources.json"
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          print(f"VEHICLE_IMAGE_COUNT={len(manifest)}")
          if failures or len(manifest) != len(profiles):
              print("FAILURES:", failures)
              raise SystemExit(f"Expected {len(profiles)} images, got {len(manifest)}")
          PY

          test "$(find PunisherDrive/Assets.xcassets -maxdepth 1 -name '*.imageset' | wc -l | tr -d ' ')" -eq 56

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/PunisherDerived"
          xcodebuild             -project PunisherDrive.xcodeproj             -scheme PunisherDrive             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath "$RUNNER_TEMP/PunisherDerived"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Verify icon and sign app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/PunisherDrive.app"
          test -d "$APP"
          test -f "$APP/Assets.car"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package test IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PunisherDerived/Build/Products/Release-iphoneos/PunisherDrive.app"
          rm -rf "$RUNNER_TEMP/punisher-ipa"
          mkdir -p "$RUNNER_TEMP/punisher-ipa/Payload"
          /usr/bin/ditto "$APP" "$RUNNER_TEMP/punisher-ipa/Payload/PunisherDrive.app"
          cd "$RUNNER_TEMP/punisher-ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/PUNISHER-DRIVE-0.6.3-10-TEST.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/PUNISHER-DRIVE-0.6.3-10-TEST.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: PUNISHER-DRIVE-0.6.3-10-TEST-IPA
          path: PUNISHER-DRIVE-0.6.3-10-TEST.ipa
          if-no-files-found: error

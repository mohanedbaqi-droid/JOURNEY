name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -project JourneyControl.xcodeproj -scheme JourneyControl -resolvePackageDependencies

      - name: Build unsigned device app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project JourneyControl.xcodeproj \
            -scheme JourneyControl \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/JourneyDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package real IPA
        run: |
          set -e
          APP="$RUNNER_TEMP/JourneyDerived/Build/Products/Release-iphoneos/JourneyControl.app"
          APP_INFO="$APP/Info.plist"
          WIDGET_INFO="$APP/PlugIns/JourneyWidget.appex/Info.plist"
          test -d "$APP"
          test -f "$APP_INFO"
          test -f "$APP/JourneyControl"
          test -f "$WIDGET_INFO"

          # Xcode 16 omits these entries in the generated plists.
          # iOS aborts immediately when CoreBluetooth is initialized without this key.
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string Journey يحتاج البلوتوث للاتصال بوحدة ESP32 وتشخيص السيارة." "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string Journey يحتاج البلوتوث للاتصال بوحدة ESP32 وتشخيص السيارة." "$APP_INFO"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$APP_INFO"

          /usr/libexec/PlistBuddy -c "Add :NSExtension dict" "$WIDGET_INFO"
          /usr/libexec/PlistBuddy -c "Add :NSExtension:NSExtensionPointIdentifier string com.apple.widgetkit-extension" "$WIDGET_INFO"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$WIDGET_INFO" | grep "^com.apple.widgetkit-extension$"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/JourneyControl.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/JOURNEY-2.4.16-48-unsigned.ipa" Payload
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/JOURNEY-2.4.16-48-unsigned.ipa" | grep "Payload/JourneyControl.app/Info.plist"
          /usr/bin/unzip -p "$GITHUB_WORKSPACE/JOURNEY-2.4.16-48-unsigned.ipa" "Payload/JourneyControl.app/Info.plist" > "$RUNNER_TEMP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$RUNNER_TEMP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$RUNNER_TEMP/Info.plist"
          /usr/bin/unzip -p "$GITHUB_WORKSPACE/JOURNEY-2.4.16-48-unsigned.ipa" "Payload/JourneyControl.app/PlugIns/JourneyWidget.appex/Info.plist" > "$RUNNER_TEMP/Widget-Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$RUNNER_TEMP/Widget-Info.plist" | grep "^com.apple.widgetkit-extension$"
          /usr/bin/unzip -l "$GITHUB_WORKSPACE/JOURNEY-2.4.16-48-unsigned.ipa" | grep "Payload/JourneyControl.app/JourneyControl"

      - uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-2.4.16-48-unsigned-IPA
          path: JOURNEY-2.4.16-48-unsigned.ipa
          if-no-files-found: error

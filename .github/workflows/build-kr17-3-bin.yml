name: Build KR17.3 ESP32-S3 BIN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare KR17.3 source
        run: |
          test -f firmware/KR17_3_SOURCE.zip || { echo "Missing firmware/KR17_3_SOURCE.zip"; exit 1; }
          mkdir -p /tmp/firmware
          unzip -q firmware/KR17_3_SOURCE.zip -d /tmp/firmware
          test "$(find /tmp/firmware -name '*.ino' | wc -l)" -eq 1
          SKETCH_DIR="$(dirname "$(find /tmp/firmware -name '*.ino' | head -1)")"
          echo "SKETCH_DIR=$SKETCH_DIR" >> "$GITHUB_ENV"
          grep -Eq '#define[[:space:]]+JOURNEY_BENCH_NO_OBD[[:space:]]+0' "$SKETCH_DIR"/*.ino
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          for lib in 'ArduinoJson' 'PubSubClient' 'TM1637Display' 'Adafruit PN532'; do arduino-cli lib install "$lib"; done
      - name: Inject MQTT password from GitHub Secret
        env:
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
        run: |
          test -n "$MQTT_PASSWORD" || { echo "Missing MQTT_PASSWORD secret"; exit 1; }
          python3 - <<'PY'
          import os, pathlib, re
          p=pathlib.Path(os.environ["SKETCH_DIR"])/"config.h"
          src=p.read_text()
          value=os.environ["MQTT_PASSWORD"]
          escaped=value.replace('\\','\\\\').replace('"','\\"')
          pattern=r'(constexpr\\s+char\\s+MQTT_PASSWORD\\[\\]\\s*=\\s*)"(?:[^"\\\\]|\\\\.)*"'
          src,n=re.subn(pattern,lambda m:m.group(1)+'"'+escaped+'"',src)
          assert n==1, "MQTT_PASSWORD declaration not found"
          p.write_text(src)
          PY
      - name: Compile ESP32-S3
        run: |
          mkdir -p /tmp/build
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,FlashMode=qio,FlashFreq=80,CPUFreq=240,CDCOnBoot=cdc0" --build-path /tmp/build "$SKETCH_DIR" --warnings all
      - name: Verify output
        run: |
          test -n "$(find /tmp/build -maxdepth 1 -name '*.ino.bin' -print -quit)"
          ls -lh /tmp/build/*.bin
      - name: Upload firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-KR17-3-ESP32S3-BIN
          path: |
            /tmp/build/*.bin
          retention-days: 7

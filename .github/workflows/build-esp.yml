name: Build JOURNEY ESP32S3 stable
on:
  workflow_dispatch:
  push:
    branches: [main, journey-main-real-doors, journey-android-real-state]
    paths: ["ESP32/**", "JOURNEY_ESP32S3/**", ".github/workflows/build-esp.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check thermal thresholds and hysteresis
        run: g++ ESP32/tests/thermal_policy_test.cpp -o /tmp/thermal-test && /tmp/thermal-test
      - uses: arduino/setup-arduino-cli@v2
      - name: Install platform and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install ArduinoJson PubSubClient TM1637 "Adafruit PN532"
      - name: Compile firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=cdc,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB --output-dir build-esp JOURNEY_ESP32S3
      - uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-ESP32S3-stack-fix
          path: build-esp/*.bin

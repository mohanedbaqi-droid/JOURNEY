name: Build JOURNEY ESP KR17.15
on:
  workflow_dispatch:
  push:
    paths:
      - "JOURNEY_KR17_15/**"
      - "firmware-source/KR17.15.zip"
      - ".github/workflows/build-esp-kr17-15.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and normalize KR17.15 source archive
        run: |
          python3 - <<'PY'
          import pathlib,zipfile,shutil,sys
          archive=pathlib.Path("firmware-source/KR17.15.zip")
          if not archive.is_file(): sys.exit("KR17.15.zip missing")
          staging=pathlib.Path("/tmp/kr17source")
          staging.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              bad=z.testzip()
              if bad: sys.exit("Damaged ZIP member: "+bad)
              for member in z.infolist():
                  p=pathlib.PurePosixPath(member.filename)
                  if p.is_absolute() or ".." in p.parts: sys.exit("Unsafe ZIP path")
              z.extractall(staging)
          sketches=list(staging.rglob("*.ino"))
          if not sketches: sys.exit("No .ino sketch in uploaded ZIP; check ZIP contents")
          preferred=[p for p in sketches if "JOURNEY" in p.name.upper()]
          sketch=preferred[0] if preferred else sketches[0]
          target=pathlib.Path("JOURNEY_KR17_15")
          if target.exists(): shutil.rmtree(target)
          shutil.copytree(sketch.parent,target)
          if sketch.name != "JOURNEY_KR17_15.ino":
              (target/sketch.name).rename(target/"JOURNEY_KR17_15.ino")
          if not (target/"config.h").is_file(): sys.exit("config.h missing next to sketch")
          print("Using source sketch:",sketch)
          PY
      - name: Normalize and verify firmware version KR17.15
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          sketch = Path("JOURNEY_KR17_15/JOURNEY_KR17_15.ino")
          source = sketch.read_text()
          expected = {
              'doc["firmwareVersion"] = "12.86-KR13-RECONNECT-SAFETY";':
                  'doc["firmwareVersion"] = "12.86-KR17.15-DUAL-DIAG-GPS";',
              'firmware v12.86-KR17.12-BLE-CELL-CLOUD':
                  'firmware v12.86-KR17.15-DUAL-DIAG-GPS',
          }
          for old, new in expected.items():
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Version normalization failed: expected one occurrence, found {count}: {old}")
              source = source.replace(old, new)
          if source.count('JOURNEY ESP diagnostics v12.86-KR17.15-DUAL-DIAG-GPS') != 2:
              raise SystemExit("Diagnostic version strings do not match KR17.15")
          if source.count('doc["firmwareVersion"] = "12.86-KR17.15-DUAL-DIAG-GPS";') != 1:
              raise SystemExit("Inconsistent telemetry firmware version")
          sketch.write_text(source)
          print("Firmware version verified in telemetry, boot banner, and both diagnostic headers: 12.86-KR17.15-DUAL-DIAG-GPS")
          PY

      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 platform and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.0
          arduino-cli lib install ArduinoJson PubSubClient TM1637 "Adafruit PN532"
      - name: Inject private credentials without printing
        env:
          JOURNEY_MQTT_PASSWORD: ${{ secrets.JOURNEY_MQTT_PASSWORD }}
          JOURNEY_OTA_AP_PASSWORD: ${{ secrets.JOURNEY_OTA_AP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,pathlib,re
          p=pathlib.Path("JOURNEY_KR17_15/config.h")
          s=p.read_text()
          for symbol,secret in [("MQTT_PASSWORD","JOURNEY_MQTT_PASSWORD"),("OTA_AP_PASSWORD","JOURNEY_OTA_AP_PASSWORD")]:
              value=os.environ.get(secret,"")
              if not value: raise SystemExit("Missing GitHub Actions secret: "+secret)
              value=value.replace("\\","\\\\").replace('"','\\"')
              pat=r'(constexpr char '+symbol+r'\[\]\s*=\s*)"[^"]*"'
              s,n=re.subn(pat,lambda m:m.group(1)+'"'+value+'"',s)
              if n!=1: raise SystemExit("Missing config symbol: "+symbol)
          p.write_text(s)
          PY
      - name: Compile KR17.15 for ESP32-S3 16MB
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:USBMode=hwcdc,CDCOnBoot=default,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,FlashMode=qio,CPUFreq=240 --output-dir build-kr17-15 JOURNEY_KR17_15
      - name: Prepare firmware.bin
        run: |
          cp build-kr17-15/JOURNEY_KR17_15.ino.bin build-kr17-15/firmware.bin
          sha256sum build-kr17-15/firmware.bin > build-kr17-15/firmware.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-KR17.15-OTA-BIN
          path: |
            build-kr17-15/firmware.bin
            build-kr17-15/firmware.sha256

      - name: Upload private OTA binary to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET_NAME; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing secret $key"; exit 1; fi
          done
          case "$R2_ACCOUNT_ID" in *[!a-fA-F0-9]*|'') echo "::error::Invalid R2 account ID"; exit 1;; esac
          case "$R2_BUCKET_NAME" in *[!a-z0-9.-]*|'') echo "::error::Invalid R2 bucket name"; exit 1;; esac
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws --endpoint-url "$ENDPOINT" s3 cp build-kr17-15/firmware.bin "s3://${R2_BUCKET_NAME}/releases/KR17.15/firmware.bin" --content-type application/octet-stream --no-progress
          aws --endpoint-url "$ENDPOINT" s3 cp build-kr17-15/firmware.sha256 "s3://${R2_BUCKET_NAME}/releases/KR17.15/firmware.sha256" --content-type text/plain --no-progress
          echo "Private OTA firmware uploaded to R2 (bucket public access remains disabled)."

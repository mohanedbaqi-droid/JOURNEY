name: Build JOURNEY Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, journey-android-real-state]
    paths: ["Android/**", ".github/workflows/build-android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve install signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: journey-android-install-signing-v1
      - name: Test and build signed install APK
        working-directory: Android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Verify package and signature
        run: |
          set -e
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -4
          cp "$APK" JOURNEY-Android-2.4.32-64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-Android-2.4.32-64-APK
          path: JOURNEY-Android-2.4.32-64.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: Android/app/build/test-results/testDebugUnitTest

name: Build JOURNEY Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, journey-android-real-state]
    paths: ["Android/**", ".github/workflows/build-android-apk.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preserve install signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: journey-android-install-signing-v1
      - name: Test and build signed install APK
        working-directory: Android
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify package and signature
        run: |
          set -e
          APK=Android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -4
          cp "$APK" JOURNEY-Android-2.4.32-64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JOURNEY-Android-2.4.32-64-APK
          path: |
            JOURNEY-Android-2.4.32-64.apk
            Android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-results
          path: Android/app/build/test-results/testDebugUnitTest

  ui-review:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JOURNEY-Android-2.4.32-64-APK
          path: packages
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install $(find packages -name 'JOURNEY-Android*.apk' | head -1)
            adb install $(find packages -name 'app-debug-androidTest.apk' | head -1)
            adb shell pm grant com.journey.control android.permission.ACCESS_FINE_LOCATION
            adb shell am instrument -w com.journey.control.test/androidx.test.runner.AndroidJUnitRunner | tee ui-test.log
            grep -q 'OK (1 test)' ui-test.log
            adb pull /sdcard/Android/data/com.journey.control/files/ui-review ui-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-UI-review
          path: |
            ui-review
            ui-test.log

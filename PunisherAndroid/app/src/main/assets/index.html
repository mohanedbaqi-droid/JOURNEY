<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Punisher Drive</title>
<style>
:root{--bg:#05070b;--card:#111720;--card2:#0d1219;--red:#d71c23;--cyan:#00cdeb;--text:#f6f7f9;--muted:#9099a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;height:100%}
body{overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;background:
radial-gradient(circle at 10% 0%,rgba(215,28,35,.14),transparent 30%),
radial-gradient(circle at 90% 5%,rgba(0,205,235,.12),transparent 32%),
linear-gradient(160deg,#05070b,#0a0d13 55%,#061016)}
#header{height:72px;padding:10px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(3,4,7,.94)}
.logo{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(215,28,35,.35)) drop-shadow(0 0 8px rgba(0,205,235,.18))}
.brand{min-width:0;flex:1}.brand b{font-size:18px;letter-spacing:.6px}.brand small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#content{flex:1;overflow:auto;padding:14px 14px 110px}
#tabs{height:88px;position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:7px 6px calc(8px + env(safe-area-inset-bottom));background:rgba(2,3,5,.96);border-top:1px solid rgba(255,255,255,.08);z-index:20}
.tab{border:0;background:transparent;color:#8c95a2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px}
.tab .ico{font-size:21px;color:var(--cyan)}.tab span{font-size:10px;font-weight:800}
.tab.home .ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(215,28,35,.12);border:1px solid rgba(215,28,35,.35);color:var(--red);font-size:24px}
.tab.active{color:#fff}.tab.active .ico{filter:drop-shadow(0 0 7px currentColor)}
.card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:14px;margin-bottom:12px}
.card.accent{border-color:rgba(0,205,235,.22)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.title{font-size:25px;font-weight:900;margin:0}.sub{color:var(--muted);font-size:12px}
.vehicle-photo{width:100%;height:225px;object-fit:contain;display:block;margin:2px auto 0;filter:drop-shadow(0 10px 14px rgba(0,0,0,.52))}
.vehicle-stage{height:238px;position:relative;display:flex;align-items:center;justify-content:center;overflow:visible;margin-top:2px}
.vehicle-stage .vehicle-photo{height:228px;margin:0;position:relative;z-index:1}
.vehicle-color-layer{position:absolute;inset:5px 0 5px 0;z-index:2;pointer-events:none;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;-webkit-mask-size:contain;mask-repeat:no-repeat;mask-position:center;mask-size:contain;opacity:.78;mix-blend-mode:color}
.plate-on-car{position:absolute;left:70%;top:70.5%;transform:translate(-50%,-50%) rotate(-1.5deg);height:22px;min-width:86px;display:flex;direction:ltr;align-items:stretch;background:#fff;color:#050505;border:1px solid #555;border-radius:3px;font:900 8px ui-monospace,monospace;box-shadow:0 1px 4px rgba(0,0,0,.42);overflow:hidden}
.plate-on-car .irq{width:12px;display:grid;place-items:center;border-right:1px solid #555;font-size:5px;line-height:5px;padding:1px 0}
.plate-on-car .pc,.plate-on-car .pl,.plate-on-car .pn{display:grid;place-items:center;padding:0 4px;border-right:1px solid #aaa}
.plate-on-car .pc{width:25px}.plate-on-car .pl{width:19px}.plate-on-car .pn{min-width:42px;border-right:0}
.iraq-plate-preview{height:48px;display:flex;direction:ltr;align-items:stretch;background:#fff;color:#050505;border:1.5px solid #555;border-radius:5px;font:900 15px ui-monospace,monospace;overflow:hidden;margin:12px auto;width:250px;max-width:100%}
.iraq-plate-preview .irq{width:30px;display:grid;place-items:center;border-right:1px solid #444;font-size:9px;line-height:9px}
.iraq-plate-preview .pc,.iraq-plate-preview .pl,.iraq-plate-preview .pn{display:grid;place-items:center;border-right:1px solid #aaa}.iraq-plate-preview .pc{width:54px}.iraq-plate-preview .pl{width:42px}.iraq-plate-preview .pn{flex:1;border-right:0}
.plate-grid{display:grid;grid-template-columns:1fr 92px;gap:10px}
.plate{display:inline-block;background:#fff;color:#080808;border:1px solid #555;border-radius:5px;padding:4px 13px;font:900 12px ui-monospace,monospace;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:7px;overflow:auto;margin:10px 0}.pill{flex:none;border-radius:999px;padding:7px 10px;background:#10151c;border:1px solid #242c35;color:#c7ccd3;font-size:11px;font-weight:800}.pill.on{color:var(--cyan);border-color:rgba(0,205,235,.3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ctrl{height:88px;border-radius:17px;border:1px solid rgba(255,255,255,.09);background:#10151c;color:#fff;font-weight:900}.ctrl.red{border-color:rgba(215,28,35,.3)}.ctrl.cyan{border-color:rgba(0,205,235,.3)}
.btn{border:1px solid rgba(0,205,235,.35);background:#0f151c;color:var(--cyan);padding:11px 13px;border-radius:14px;font-weight:850}.btn.red{border-color:rgba(215,28,35,.38);color:var(--red)}.btn.fill{background:linear-gradient(90deg,var(--red),var(--cyan));border:0;color:#fff}
.garage-car{display:grid;grid-template-columns:148px 1fr;gap:10px;align-items:center}.garage-car img{width:144px;height:104px;object-fit:contain}
.badge{font-size:10px;border-radius:999px;padding:4px 8px;background:rgba(0,205,235,.1);color:var(--cyan);font-weight:850}
.actions{display:flex;gap:7px;margin-top:10px}.actions .btn{flex:1;padding:9px 6px;font-size:11px}
.section{font-size:17px;font-weight:900;margin:13px 2px 8px}
.info{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 3px;border-bottom:1px solid rgba(255,255,255,.06)}.info:last-child{border-bottom:0}.info span:first-child{color:var(--muted);font-size:12px}.info b{font-size:13px;text-align:left}
.about-logo{text-align:center;padding:8px 0 16px}.about-logo .skull{font-size:84px;line-height:1;color:var(--red);filter:drop-shadow(0 0 15px rgba(215,28,35,.28))}.about-logo h2{margin:7px 0 4px;font-size:25px}.about-logo h3{margin:0;color:var(--red)}.about-logo p{color:var(--cyan);font-size:13px}
.empty{text-align:center;padding:30px 15px}.empty .big{font-size:58px;color:var(--cyan)}.empty h3{font-size:20px;margin:8px}.empty p{font-size:13px;color:var(--muted);line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;z-index:50}.modal.open{display:flex}.sheet{width:100%;max-height:86%;overflow:auto;background:#0b1017;border-radius:26px 26px 0 0;border-top:1px solid rgba(0,205,235,.25);padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.field{width:100%;height:48px;border-radius:13px;border:1px solid #2a323d;background:#0a0e13;color:#fff;padding:0 12px;margin:6px 0 11px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0 15px}.swatch{border:0;background:transparent;color:#ddd;font-size:10px}.dot{width:38px;height:38px;border-radius:50%;margin:auto auto 5px;border:2px solid rgba(255,255,255,.3)}.swatch.sel .dot{outline:3px solid var(--cyan)}
#map{height:calc(100vh - 190px);border-radius:20px;overflow:hidden;background:#0b1017;border:1px solid rgba(255,255,255,.08)}.mapmsg{padding:30px 18px;text-align:center}
.map-card{margin-top:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.metric{text-align:center;background:#0b1017;border:1px solid #232a33;border-radius:14px;padding:9px 5px}.metric b{display:block;font-size:15px}.metric small{color:var(--muted);font-size:9px}
#splash{position:fixed;inset:0;z-index:99;background:
radial-gradient(circle at center,rgba(215,28,35,.16),transparent 35%),
linear-gradient(#040507,#071018);display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .35s}
#splash.hide{opacity:0;pointer-events:none}.splash-logo{width:265px;height:265px;object-fit:contain;filter:drop-shadow(0 0 25px rgba(215,28,35,.45))}.splash-title{font-size:34px;font-weight:1000;letter-spacing:1px;color:var(--red);font-style:italic}.splash-drive{font-size:35px;font-weight:1000;letter-spacing:2px;color:var(--cyan);font-style:italic}.splash-sub{font-size:11px;color:#dbe7ee;letter-spacing:3px;margin-top:9px}

/* Match vehicle photo, paint mask and plate to the same source coordinates. */
.vehicle-stage{display:flex;align-items:center;justify-content:center}
.vehicle-media{position:relative;width:min(100%,342px);aspect-ratio:3/2;flex:none}
.vehicle-stage .vehicle-media .vehicle-photo{position:absolute;inset:0;width:100%;height:100%;margin:0;object-fit:fill;z-index:1}
.vehicle-stage .vehicle-media .vehicle-color-layer{position:absolute;inset:0;z-index:2;-webkit-mask-size:100% 100%;mask-size:100% 100%}
.vehicle-stage .vehicle-media .plate-on-car{z-index:3;min-width:0;height:auto;aspect-ratio:140/31;align-items:stretch;box-sizing:border-box;border-radius:1px;overflow:hidden;font-size:clamp(3px,1.2vw,7px);line-height:1}
.vehicle-stage .plate-on-car .irq,.vehicle-stage .plate-on-car .pc,.vehicle-stage .plate-on-car .pl,.vehicle-stage .plate-on-car .pn{display:flex;align-items:center;justify-content:center;min-width:0;width:auto;padding:0 1px;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.vehicle-stage .plate-on-car .irq{flex:0 0 12%;font-size:clamp(2px,.65vw,4px);line-height:1}
.vehicle-stage .plate-on-car .pc{flex:0 0 20%}
.vehicle-stage .plate-on-car .pl{flex:0 0 15%}
.vehicle-stage .plate-on-car .pn{flex:1;border-right:0}
.plate-fit-controls{margin:12px 0;padding:12px;border:1px solid rgba(0,205,235,.25);border-radius:14px;background:rgba(0,205,235,.035)}
.plate-fit-controls label{display:block;margin:10px 0 4px}
.plate-fit-controls input[type=range]{display:block;width:100%;accent-color:#00cdeb}
.ctrl:disabled{opacity:.50;filter:grayscale(.5);cursor:not-allowed}

</style>

function normalizePlateNumber(x){return String(x||'').replace(/\D/g,'').slice(0,6)}
function migratePlate(v){
  if(!v.plateGovernorateCode||!v.plateLetter||!v.plateNumber){
    var m=String(v.plateText||'').toUpperCase().match(/^(\d{2})\s*[- ]?\s*([A-Z])\s*[- ]?\s*(\d{1,6})$/);
    if(m){v.plateGovernorateCode=m[1];v.plateLetter=m[2];v.plateNumber=m[3]}
  }
  if(!v.plateGovernorateCode)v.plateGovernorateCode='14';
  if(!v.plateLetter)v.plateLetter='A';
  if(v.plateNumber==null)v.plateNumber='';
  v.plateNumber=normalizePlateNumber(v.plateNumber);
  v.plateText=v.plateNumber?(v.plateGovernorateCode+' '+v.plateLetter+' '+v.plateNumber):'';
}

  openModal('<h2>'+t('addCar')+'</h2><label>'+t('make')+'</label><select id="make" class="field">'+makes.map(function(x){return '<option>'+esc(x)+'</option>'}).join('')+'</select><label>'+t('model')+'</label><select id="model" class="field"></select><label>'+t('generation')+'</label><select id="gen" class="field"></select><label>'+t('year')+'</label><select id="year" class="field"></select><button class="btn fill" style="width:100%" id="addSave">'+t('addGarage')+'</button>')
}
function fillAdd(){var mk=document.getElementById('make'),mo=document.getElementById('model'),ge=document.getElementById('gen'),yr=document.getElementById('year');if(!mk)return;var updateModels=function(){var arr=Array.from(new Set(profiles.filter(function(p){return p.make===mk.value}).map(function(p){return p.model}))).sort();mo.innerHTML=arr.map(function(x){return '<option>'+esc(x)+'</option>'}).join('');updateGen()};var updateGen=function(){var arr=profiles.filter(function(p){return p.make===mk.value&&p.model===mo.value});ge.innerHTML=arr.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.generation)+'</option>'}).join('');updateYears()};var updateYears=function(){var p=profiles.find(function(x){return x.id===ge.value});yr.innerHTML=(p?p.years.slice().sort(function(a,b){return b-a}):[]).map(function(y){return '<option>'+y+'</option>'}).join('')};mk.onchange=updateModels;mo.onchange=updateGen;ge.onchange=updateYears;updateModels();document.getElementById('addSave').onclick=function(){var p=profiles.find(function(x){return x.id===ge.value});if(!p)return;var v={id:Date.now().toString(36)+Math.random().toString(36).slice(2),profileID:p.id,year:Number(yr.value),nickname:'',colorHex:'#F2F2F2',plateText:'',plateGovernorateCode:'14',plateLetter:'A',plateNumber:'',espDeviceID:'',latitude:null,longitude:null,speedKmh:0,online:false,updatedAt:0};garage.push(v);activeId=v.id;save();closeModal();setTab('garage')}}

function nativeHasDoc(v,kind){
  try{return !!(window.AndroidDocs&&AndroidDocs.hasDocument(v.id,kind))}catch(e){return !!v[kind+'DocSaved']}
}
function docStatus(v,kind){return nativeHasDoc(v,kind)?t('savedLocal'):t('notAdded')}
function customerDocs(v){
  var annual=nativeHasDoc(v,'annual'),unified=nativeHasDoc(v,'unified');
  openModal('<h2>'+t('customerDocs')+'</h2>'+
    '<div class="card"><label>'+t('customerName')+'</label><input id="customerName" class="field" value="'+esc(v.customerName||'')+'"><label>'+t('customerPhone')+'</label><input id="customerPhone" inputmode="tel" class="field" value="'+esc(v.customerPhone||'')+'"></div>'+
    '<div class="card"><div class="row between"><b>'+t('annualDoc')+'</b><span class="badge" id="annualStatus">'+(annual?t('savedLocal'):t('notAdded'))+'</span></div><input class="doc-file" data-kind="annual" type="file" accept="image/*" capture="environment" style="margin-top:12px;width:100%"><button class="btn red doc-delete" data-kind="annual" style="margin-top:8px;width:100%">'+(annual?'✕ '+t('annualDoc'):'')+'</button></div>'+
    '<div class="card"><div class="row between"><b>'+t('unifiedDoc')+'</b><span class="badge" id="unifiedStatus">'+(unified?t('savedLocal'):t('notAdded'))+'</span></div><input class="doc-file" data-kind="unified" type="file" accept="image/*" capture="environment" style="margin-top:12px;width:100%"><button class="btn red doc-delete" data-kind="unified" style="margin-top:8px;width:100%">'+(unified?'✕ '+t('unifiedDoc'):'')+'</button></div>'+
    '<div class="card"><div class="section">'+t('privacy')+'</div><div class="sub">'+t('privacyText')+'</div></div>'+
    '<button class="btn fill" id="customerSave" style="width:100%">'+t('save')+'</button>');
  document.getElementById('sheet').dataset.vid=v.id
}
function compressAndStoreDoc(file,v,kind,statusEl){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var max=1800,w=img.width,h=img.height,scale=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*scale));cv.height=Math.max(1,Math.round(h*scale));
      var ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
      var data=cv.toDataURL('image/jpeg',0.84),ok='';
      try{ok=window.AndroidDocs?AndroidDocs.saveDocument(v.id,kind,data):''}catch(err){}
      v[kind+'DocSaved']=!!ok;save();
      if(statusEl)statusEl.textContent=v[kind+'DocSaved']?t('savedLocal'):t('notAdded')
    };
    img.src=e.target.result
  };
  reader.readAsDataURL(file)
}
function customerServerDialog(){
  var url=localStorage.getItem('pd_customer_server_url')||'',project=localStorage.getItem('pd_customer_server_project')||'';
  openModal('<h2>'+t('customerServer')+'</h2><label>'+t('serverUrl')+'</label><input id="serverUrl" class="field" value="'+esc(url)+'" placeholder="https://customers.example.com"><label>'+t('projectName')+'</label><input id="serverProject" class="field" value="'+esc(project)+'"><div class="card"><div class="sub">'+t('uploadDisabled')+'</div></div><button class="btn fill" id="serverSave" style="width:100%">'+t('serverSave')+'</button>')
}

function appearance(v){
  migratePlate(v);selectedColor=v.colorHex||'#F2F2F2';
  var govOptions=governorates.map(function(g){return '<option value="'+g[0]+'" '+(g[0]===v.plateGovernorateCode?'selected':'')+'>'+g[0]+' • '+g[1]+'</option>'}).join('');
  var letterOptions=plateLetters.map(function(x){return '<option value="'+x+'" '+(x===v.plateLetter?'selected':'')+'>'+x+'</option>'}).join('');
  var fields=[
    ['fitX','plateShiftX','fitX',-.18,.18,.005,0],
    ['fitY','plateShiftY','fitY',-.18,.18,.005,0],
    ['fitScale','plateScale','fitScale',.6,1.6,.02,1],
    ['fitAngle','plateAngleOffset','fitAngle',-15,15,.5,0]
  ];
  var fitHtml=fields.map(function(d){
    var value=v[d[1]]==null?d[6]:Number(v[d[1]]);
    return '<label for="'+d[0]+'">'+t(d[2])+' <small id="'+d[0]+'Value">'+value.toFixed(2)+'</small></label>'+
      '<input type="range" id="'+d[0]+'" min="'+d[3]+'" max="'+d[4]+'" step="'+d[5]+'" value="'+value+'">'
  }).join('');
  openModal('<h2>'+t('appearance')+'</h2>'+
    '<div style="text-align:center"><div id="appearanceVehicleStage">'+vehicleStage(v)+'</div><div id="appearancePlatePreview">'+plateHtml(v,true)+'</div></div>'+
    '<div class="plate-grid"><div><label>'+t('governorate')+'</label><select id="plateGov" class="field">'+govOptions+'</select></div>'+
    '<div><label>'+t('letter')+'</label><select id="plateLetter" class="field">'+letterOptions+'</select></div></div>'+
    '<label>'+t('number6')+'</label><input id="plateNumber" class="field" inputmode="numeric" maxlength="6" value="'+esc(v.plateNumber||'')+'" placeholder="123456">'+
    '<div class="palette">'+colors().map(function(c){return '<button class="swatch '+(c[1].toLowerCase()===selectedColor.toLowerCase()?'sel':'')+'" data-color="'+c[1]+'"><div class="dot" style="background:'+c[1]+'"></div>'+c[0]+'</button>'}).join('')+'</div>'+
    '<div class="plate-fit-controls"><b>'+t('plateFit')+'</b>'+fitHtml+
    '<button class="btn" style="width:100%;margin-top:12px" id="fitReset">'+t('resetFit')+'</button></div>'+
    '<button class="btn fill" style="width:100%" id="appearanceSave">'+t('save')+'</button>')
}

function refreshAppearancePreview(){
  var sheet=document.getElementById('sheet');
  var v=garage.find(function(x){return x.id===sheet.dataset.vid});
  var stage=document.getElementById('appearanceVehicleStage');
  if(!v||!stage)return;
  var number=normalizePlateNumber(document.getElementById('plateNumber').value);
  var gov=document.getElementById('plateGov').value,letter=document.getElementById('plateLetter').value;
  var p=Object.assign({},v,{
    colorHex:selectedColor,plateGovernorateCode:gov,plateLetter:letter,
    plateNumber:number,plateText:number?(gov+' '+letter+' '+number):'',
    plateShiftX:Number(document.getElementById('fitX').value),
    plateShiftY:Number(document.getElementById('fitY').value),
    plateScale:Number(document.getElementById('fitScale').value),
    plateAngleOffset:Number(document.getElementById('fitAngle').value)
  });
  stage.innerHTML=vehicleStage(p);
  var platePreview=document.getElementById('appearancePlatePreview');
  if(platePreview)platePreview.innerHTML=plateHtml(p,true);
}
function bindModal(){fillAdd();
document.querySelectorAll('.doc-file').forEach(function(input){input.onchange=function(){var id=document.getElementById('sheet').dataset.vid,v=garage.find(function(x){return x.id===id});if(v&&input.files&&input.files[0])compressAndStoreDoc(input.files[0],v,input.dataset.kind,document.getElementById(input.dataset.kind+'Status'))}});
document.querySelectorAll('.doc-delete').forEach(function(b){b.onclick=function(){var id=document.getElementById('sheet').dataset.vid,v=garage.find(function(x){return x.id===id}),kind=b.dataset.kind;if(!v)return;try{if(window.AndroidDocs)AndroidDocs.deleteDocument(v.id,kind)}catch(e){}v[kind+'DocSaved']=false;save();var st=document.getElementById(kind+'Status');if(st)st.textContent=t('notAdded')}});
var cs=document.getElementById('customerSave');if(cs)cs.onclick=function(){var id=document.getElementById('sheet').dataset.vid,v=garage.find(function(x){return x.id===id});if(v){v.customerName=(document.getElementById('customerName').value||'').trim();v.customerPhone=(document.getElementById('customerPhone').value||'').trim();v.customerServerSyncState='local-only';save()}closeModal();render()};
var ss=document.getElementById('serverSave');if(ss)ss.onclick=function(){var u=(document.getElementById('serverUrl').value||'').trim(),p=(document.getElementById('serverProject').value||'').trim();if(u&&u.indexOf('https://')!==0){alert('HTTPS required');return}localStorage.setItem('pd_customer_server_url',u);localStorage.setItem('pd_customer_server_project',p);closeModal();render()};
document.querySelectorAll('.swatch').forEach(function(b){b.onclick=function(){selectedColor=b.dataset.color;document.querySelectorAll('.swatch').forEach(function(x){x.classList.toggle('sel',x.dataset.color===selectedColor)});refreshAppearancePreview()}});var pn=document.getElementById('plateNumber');if(pn)pn.oninput=function(){pn.value=normalizePlateNumber(pn.value);refreshAppearancePreview()};
['plateGov','plateLetter'].forEach(function(id){var el=document.getElementById(id);if(el)el.onchange=refreshAppearancePreview});
['fitX','fitY','fitScale','fitAngle'].forEach(function(id){var el=document.getElementById(id);if(el)el.oninput=function(){document.getElementById(id+'Value').textContent=Number(el.value).toFixed(2);refreshAppearancePreview()}});
var reset=document.getElementById('fitReset');if(reset)reset.onclick=function(){[['fitX',0],['fitY',0],['fitScale',1],['fitAngle',0]].forEach(function(p){document.getElementById(p[0]).value=p[1];document.getElementById(p[0]+'Value').textContent=Number(p[1]).toFixed(2)});refreshAppearancePreview()};
var s=document.getElementById('appearanceSave');if(s)s.onclick=function(){var id=document.getElementById('sheet').dataset.vid;var v=garage.find(function(x){return x.id===id});if(v){v.colorHex=selectedColor;v.plateGovernorateCode=document.getElementById('plateGov').value;v.plateLetter=document.getElementById('plateLetter').value;v.plateNumber=normalizePlateNumber(document.getElementById('plateNumber').value);v.plateText=v.plateNumber?(v.plateGovernorateCode+' '+v.plateLetter+' '+v.plateNumber):'';v.plateShiftX=Number(document.getElementById('fitX').value);v.plateShiftY=Number(document.getElementById('fitY').value);v.plateScale=Number(document.getElementById('fitScale').value);v.plateAngleOffset=Number(document.getElementById('fitAngle').value);save()}closeModal();render()};var es=document.getElementById('espSave');if(es)es.onclick=function(){var id=document.getElementById('sheet').dataset.vid;var v=garage.find(function(x){return x.id===id});if(v){var d=document.getElementById('esp').value.trim();garage.forEach(function(x){if(x.id!==v.id&&x.espDeviceID===d)x.espDeviceID=''});v.espDeviceID=d;save()}closeModal();render()}}
function espDialog(v){openModal('<h2>ESP</h2><input id="esp" class="field" value="'+esc(v.espDeviceID||'')+'" placeholder="ESP Device ID"><button class="btn fill" style="width:100%" id="espSave">'+t('save')+'</button>')}
function bind(){document.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(){var a=b.dataset.act,id=b.dataset.id,v=garage.find(function(x){return x.id===id});if(a==='add')addDialog();if(a==='server')customerServerDialog();if(a==='activate'&&v){activeId=v.id;save();render()}if(a==='documents'&&v){customerDocs(v)}if(a==='appearance'&&v){document.getElementById('sheet').dataset.vid=v.id;appearance(v);document.getElementById('sheet').dataset.vid=v.id}if(a==='esp'&&v){espDialog(v);document.getElementById('sheet').dataset.vid=v.id}}});document.querySelectorAll('[data-tabgo]').forEach(function(b){b.onclick=function(){setTab(b.dataset.tabgo)}});var ls=document.getElementById('langSelect');if(ls)ls.onchange=function(){lang=ls.value;localStorage.setItem('pd_lang',lang);applyLang();render()}}
function loadMap(){var located=garage.filter(function(v){return v.latitude!=null&&v.longitude!=null});if(!located.length)return;var old=document.getElementById('leafletScript');if(old)old.remove();var css=document.getElementById('leafletCss');if(!css){css=document.createElement('link');css.id='leafletCss';css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';css.integrity='sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';css.crossOrigin='anonymous';document.head.appendChild(css)}var sc=document.createElement('script');sc.id='leafletScript';sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';sc.integrity='sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';sc.crossOrigin='anonymous';sc.onload=function(){var m=L.map('map');var pts=[];located.forEach(function(v){var p=[v.latitude,v.longitude];pts.push(p);var mk=L.circleMarker(p,{radius:v.id===activeId?12:9,color:v.id===activeId?'#d71c23':'#00cdeb',fillColor:'#111722',fillOpacity:.95,weight:3}).addTo(m);mk.bindPopup('<b>'+esc(name(v))+'</b><br>'+esc(plateText(v)||'—')+'<br>'+t('speed')+': '+Math.round(v.speedKmh||0)+' km/h');mk.on('click',function(){showMapInfo(v)})});if(pts.length===1)m.setView(pts[0],15);else m.fitBounds(pts,{padding:[30,30]})};document.head.appendChild(sc)}
function showMapInfo(v){var el=document.getElementById('mapInfo');if(!el)return;el.innerHTML='<div class="card map-card"><div class="row between"><div><b>'+esc(name(v))+'</b><div class="sub">'+esc(plateText(v)||'—')+'</div></div>'+(v.id===activeId?'<span class="badge">'+t('active')+'</span>':'<button class="btn red" data-act="activate" data-id="'+v.id+'">'+t('setActive')+'</button>')+'</div><div class="metrics"><div class="metric"><small>'+t('speed')+'</small><b>'+Math.round(v.speedKmh||0)+' km/h</b></div><div class="metric"><small>'+t('status')+'</small><b>'+((v.speedKmh||0)>1?t('moving'):t('stopped'))+'</b></div><div class="metric"><small>'+t('connection')+'</small><b>'+(v.online?'Online':'Offline')+'</b></div></div></div>';bind()}
applyLang();render();setTimeout(function(){document.getElementById('splash').classList.add('hide')},900)
})();
</script>
